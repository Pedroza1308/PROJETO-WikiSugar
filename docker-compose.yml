services:
  wikisugar-mobile:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    env_file: .env
    environment:
      - NODE_ENV=development
      # Sem isso o QR code aponta para o IP interno do container (172.x),
      # que o celular nao alcanca, e o Expo Go fica carregando para sempre.
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:?Defina HOST_IP no arquivo .env (copie o .env.example)}
    command: npx expo start ${EXPO_START_ARGS:---lan}
    stdin_open: true
    tty: true
